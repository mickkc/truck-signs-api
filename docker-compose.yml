services:
  db:
    image: postgres:18.4
    container_name: tsa_db
    env_file: .env
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:  ${DB_NAME}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER} -d ${DB_NAME}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: tsa_backend
    command: gunicorn tsa_app.wsgi:application --bind 0.0.0.0:8000 --workers 4
    networks:
      - tsa-network
    ports:
      - '8020:8000'
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./src/staticfiles:/app/src/staticfiles
      - ./src/media:/app/src/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  tsa-network:
    driver: bridge

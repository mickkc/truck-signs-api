services:
  db:
    image: postgres:18.4
    container_name: tsa_db
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:  ${DB_NAME}
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}' ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: truck-signs-api:latest
    container_name: tsa_backend
    networks:
      - tsa-network
    volumes:
      - static_files:/app/src/staticfiles
      - media:/app/src/media
    ports:
      - '8020:8000'
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_files:
  media:

networks:
  tsa-network:
    driver: bridge
